name: CI

on:
  push:
    branches:
      - main
      - agent/adb-support
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: make test
      - name: Build binary
        run: make build
      - name: Smoke start without ADB
        run: |
          mkdir -p data
          cp config.yaml.example data/config.yaml
          ./droidtv-remote > /tmp/droidtv.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7503/api/status >/tmp/status.json; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/droidtv.log
          exit 1

  container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Containerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: ${{ matrix.platform == 'linux/amd64' }}
          tags: droidtv-remote:ci
      - name: Verify packaged ADB
        if: matrix.platform == 'linux/amd64'
        run: docker run --rm --entrypoint /usr/bin/adb droidtv-remote:ci version
