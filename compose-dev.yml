services:
  droidtv-remote:
    container_name: remotedev
    build:
      context: .
      dockerfile: deploy/Containerfile
    image: vm75/droidtv-remote:latest
    restart: unless-stopped
    # Using host networking is highly recommended for LAN devices
    # to ensure the container can reach the TV without issues.
    network_mode: host
    volumes:
      - ./dev/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_PORT=${SERVER_PORT:-7503}
