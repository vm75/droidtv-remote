services:
  droidtv-remote:
    container_name: remotedev
    build:
      context: .
      dockerfile: deploy/Containerfile
    image: vm75/droidtv-remote:latest
    restart: unless-stopped
    # Host networking lets the server reach TVs on the LAN.
    network_mode: host
    environment:
      DROIDTV_ADB_ENABLED: "false"
      DROIDTV_ADB_PATH: /usr/bin/adb
    volumes:
      - ${DATA_DIR:-./dev/data}:/app/data
    environment:
      - SERVER_PORT=${SERVER_PORT:-7503}
